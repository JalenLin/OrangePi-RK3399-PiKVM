# =============================================================================
# OrangePi RK3399 PiKVM - build configuration
# =============================================================================

BOARD="orangepi-rk3399"
ARCH="arm64"
CROSS_COMPILE="aarch64-linux-gnu-"

# --- Track selection -------------------------------------------------------
# rk612 : Rockchip BSP 6.12.69. The default, and the only one that boots a
#         current Arch userland - see below.
# bsp   : vendor Linux 4.4.179. HDMI IN is known to work here, but the kernel
#         is too old for the rootfs: systemd 258 dropped cgroup v1 entirely,
#         we install 261, and 4.4's cgroup v2 has no cpu controller (systemd's
#         own baseline is kernel 5.4). systemd refuses to start, PID 1 exits,
#         the board panics. Kept only for reference and for diffing DTS.
# mainline : kernel.org 6.x. Still the long-term goal; needs the tc358749
#         driver and the rkisp1 YUV422 question settled.
KERNEL_TRACK="${KERNEL_TRACK:-rk612}"

# --- Target medium ---------------------------------------------------------
# sd | emmc. The board has both, and the same build serves either - the only
# difference is the partition GUIDs, which are not ours to choose. See the
# "Image layout" block below and docs/emmc.md.
TARGET_MEDIUM="${TARGET_MEDIUM:-sd}"

# --- Upstream sources ------------------------------------------------------
# Branch names, not commits: fetch_repo does `git clone --depth 1 -b`, so a
# checkout is whatever that branch pointed at on the day it was cloned, and it
# is never updated afterwards. See "Where the sources come from" in
# docs/building.md.
OPI_GIT="https://github.com/orangepi-xunlong"

KERNEL_BSP_REPO="${OPI_GIT}/OrangePiRK3399_kernel.git"
KERNEL_BSP_BRANCH="master"          # = 4.4.179; has the rkisp1 + tc35874x HDMI-IN path

UBOOT_BSP_REPO="${OPI_GIT}/OrangePiRK3399_uboot.git"
UBOOT_BSP_BRANCH="master"           # has Rockchip make.sh (idbloader/uboot/trust)
UBOOT_BSP_MAKE_TARGET="rk3399"      # ./make.sh rk3399

EXTERNAL_REPO="${OPI_GIT}/OrangePiRK3399_external.git"
EXTERNAL_BRANCH="orangepi-rk3399_v1.4"

TOOLCHAIN_REPO="${OPI_GIT}/toolchain.git"
TOOLCHAIN_BRANCH="aarch64-linux-gnu-6.3"

# Rockchip's own 6.12 BSP: modern enough for current systemd, while keeping
# the vendor tc35874x driver, an Orange Pi RK3399 board DTS, and the Rockchip
# boot.img/resource.img make targets our image assembly depends on.
KERNEL_RK612_REPO="https://github.com/rockchip-linux/kernel.git"
KERNEL_RK612_BRANCH="develop-6.12"
KERNEL_RK612_DEFCONFIG="rockchip_linux_defconfig"
KERNEL_RK612_BOOT_TARGET="rk3399-orangepi.img"
KERNEL_RK612_DTB="rk3399-orangepi"

KERNEL_ML_REPO="https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git"
KERNEL_ML_TAG="v6.12"
UBOOT_ML_REPO="https://source.denx.de/u-boot/u-boot.git"
UBOOT_ML_TAG="v2024.10"
UBOOT_ML_DEFCONFIG="orangepi-rk3399_defconfig"

# --- Rootfs ----------------------------------------------------------------
# Arch Linux ARM generic aarch64, matching PiKVM upstream.
ALARM_ROOTFS_URL="http://os.archlinuxarm.org/os/ArchLinuxARM-aarch64-latest.tar.gz"
# PiKVM's own pacman repo. rpi4-aarch64 is plain aarch64; kvmd/ustreamer from
# here are board-agnostic. The board-specific bits live in our own overlay
# instead of a kvmd-platform-* package.
PIKVM_REPO_URL="https://files.pikvm.org/repos/arch/rpi4-aarch64"

# --- Image layout ----------------------------------------------------------
# Taken verbatim from the vendor SDK (OrangePiRK3399_scripts/lib/build_image.sh)
# so a card we write is laid out exactly the way this board's BootROM and
# U-Boot already expect. All values are 512-byte sectors.
SEC_LOADER1=64                 # idbloader.img (TPL/SPL), written raw
SEC_UBOOT=24576                # uboot.img     -> GPT part 1 "uboot"
SEC_UBOOT_END=32767
SEC_TRUST=32768                # trust.img     -> GPT part 2 "trust"
SEC_TRUST_END=40959
SEC_BOOT=49152                 # boot.img      -> GPT part 3 "boot"  (128 MiB)
# The vendor sized this 32 MiB, which fits their 4.4 kernel's 19 MiB boot.img
# but not the 6.12 one (41 MiB - rockchip_linux_defconfig builds far more in).
# Growing it is free: the vendor layout leaves ~128 MiB unused between boot
# and rootfs (their "backup" region), so this takes space nothing else claims
# and rootfs still starts exactly where it did. U-Boot locates the partition
# by GPT name, so its size is not something the boot ROM cares about.
SEC_BOOT_END=311295
SEC_ROOTFS=376832              # rootfs        -> GPT part 4 "rootfs" (184 MiB in)

# The rootfs and MSD partition GUIDs, and they are not cosmetic: the vendor
# U-Boot hardcodes the rootfs one and the kernel resolves root= from it.
#
# The prefix is what selects the medium, and it is the vendor's choice, not
# ours. common/boot_rkimg.c in the BSP U-Boot appends root= to bootargs from
# a two-way branch on the device it booted from:
#
#     if (!strcmp(boot_media, "emmc"))  ... root=PARTUUID=615e0000-0000
#     else                              ... root=PARTUUID=614e0000-0000
#
# Thirteen characters, hardcoded, with no way to override them from the image.
# So an SD card must carry 614e and an eMMC must carry 615e, and an image
# written to the wrong medium stops at "Waiting for root device".
#
# That truncation is also why the two families exist at all. The kernel
# matches PARTUUID by *prefix* - match_dev_by_uuid() compares only strlen() of
# what it was given - so "614e0000-0000" would equally match a 615e-free card's
# rootfs and its MSD partition, and on a board with both media populated it
# would match across devices too. Keeping the medium in the prefix is what
# stops an SD boot from mounting the eMMC's rootfs.
case "${TARGET_MEDIUM}" in
    sd)   PART_UUID_PREFIX="614e0000" ;;
    emmc) PART_UUID_PREFIX="615e0000" ;;
    *)    echo "TARGET_MEDIUM must be sd or emmc, not '${TARGET_MEDIUM}'" >&2
          exit 1 ;;
esac
ROOTFS_PART_UUID="${PART_UUID_PREFIX}-0000-4b53-8000-1d28000054a9"

# boot.img is NOT a filesystem: it is an Android boot image built by the vendor
# kernel Makefile (kernel Image + resource.img holding the DTB), flashed raw.
KERNEL_BSP_DEFCONFIG="rk3399_linux_defconfig"
KERNEL_BSP_BOOT_TARGET="rk3399-orangepi-rk3399.img"
KERNEL_BSP_DTB="rk3399-orangepi-rk3399"

# The rootfs cannot grow after the fact: MSD sits behind it and would have to
# be moved, so this is the size it keeps. The rootfs content is ~2.9 GB,
# which at the old 3072 left the running board 90% full and with no room to
# stage a boot.img or an ISO.
IMG_ROOT_SIZE_MB=6144

# MSD - where kvmd keeps the images it offers to the target as a CD-ROM or a
# flash drive. Last partition on purpose: it is the one first boot expands to
# fill the card (see overlay/usr/lib/pikvm/expand-msd.sh). Only big enough in
# the image to be a valid ext4; the card decides the real size.
IMG_MSD_MIN_MB=64
MSD_PART_UUID="${PART_UUID_PREFIX}-0000-4b53-8000-1d28000054aa"

# --- Image name ------------------------------------------------------------
# The kernel track belongs in the filename: these cards are physically
# indistinguishable, and flashing the wrong one wastes a debugging cycle
# chasing a bug that was fixed two kernels ago.
#
# There used to be a second "base" variant here, built without /opt/rkmpp.
# It is gone. Without MPP there is no hardware encoder, so it did software
# MJPEG at 316% CPU and 78 C, and it could not do H.264 or WebRTC at all -
# ustreamer has no software H.264 encoder. It was strictly worse in every
# measurement, so it existed only to be not flashed.
# The medium belongs in it for the same reason, and more sharply: the two
# images are byte-identical apart from six GUIDs, so nothing about a card or a
# file tells them apart afterwards, and the wrong one boots to a stop.
case "${TARGET_MEDIUM}" in
    sd)   IMG_NAME="orangepi-rk3399-pikvm-${KERNEL_TRACK}" ;;
    emmc) IMG_NAME="orangepi-rk3399-pikvm-${KERNEL_TRACK}-emmc" ;;
esac
ROOTFS_TAR="rootfs.tar"

# --- Target system ---------------------------------------------------------
TARGET_HOSTNAME="pikvm"   # not HOSTNAME: that name collides with a bash builtin
TARGET_TIMEZONE="Asia/Taipei"
TARGET_LOCALE="en_US.UTF-8"

# Root password for the image. PiKVM upstream ships root:root and tells you to
# change it on first login; we match that. Locking the account instead - which
# this image did at first - leaves no way in at all: not over SSH, not on the
# serial console, on a device whose entire job is out-of-band access.
TARGET_ROOT_PASSWORD="${TARGET_ROOT_PASSWORD:-root}"
