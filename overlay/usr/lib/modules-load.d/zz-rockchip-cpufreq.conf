# CPU frequency scaling. Without this the board runs at whatever patch 0001
# pinned the clusters to - 816 MHz little, 1200 MHz big - forever, and the
# cpu-thermal zone has no cooling device at all, so its 70 C and 85 C passive
# trips do nothing and only the 115 C critical trip (a hard power-off) is
# real. Loading this registers cpufreq-cpu0 and cpufreq-cpu4 as cooling
# devices and hands the thermal governor something to actually pull.
#
# Why a module and not =y: built in, this driver oopsed inside
# deferred_probe_work_func and took the deferred-probe worker with it, so the
# SD card never probed and the board could not find its own root filesystem.
# See config/kernel-fragments/pikvm.config. As a module it loads on an
# already-mounted rootfs, where the same oops would cost one systemd service
# instead of the machine. It has been tested by hand on hardware and does not
# oops on the current tree, but "does not oops when loaded late" is not
# evidence that it is safe to probe during boot, so it stays =m.
#
# The filename sorts last on purpose. systemd-modules-load is one process
# walking these files in order; a module that dies takes the rest of the run
# with it. Anything that kills this one must not be able to cost the KVM its
# USB gadget or its capture bridge, so kvmd.conf loads first.
rockchip_cpufreq
