# The MJPEG encoder ustreamer talks to is not a kernel device node. It is a
# libv4l plugin: v4l2convert.so intercepts open()/ioctl()/mmap() and hands
# them to libv4l-rkmpp, which drives the VPU through Rockchip MPP. What lives
# at this path is a plain text file whose contents configure that plugin.
#
# It has to be under /dev/video* even so. libv4l only considers a path for
# plugin dispatch when it looks like a V4L2 device: /dev/rkmpp-enc is ignored
# and every ioctl on it returns ENOTTY from the regular file underneath,
# while /dev/video-enc-mjpeg is picked up. The name is load-bearing, not
# decorative.
#
# /dev is devtmpfs, so this is recreated on every boot. "C" copies only when
# the destination is absent, which is always, and never clobbers a real node.
# Group kvmd because ustreamer runs as kvmd.
C /dev/video-enc-mjpeg 0660 root kvmd - /usr/lib/pikvm/rkmpp-mjpeg-encoder

# The same plugin again, configured for H.264 instead of MJPEG.
#
# Two files, not one, because each of these is a separate encoder instance
# with a fixed codec: the plugin reads "codecs=" once, at open(), and
# ustreamer opens its JPEG encoder and its H.264 encoder independently and
# keeps both alive. One node cannot be both, so the streamer gets one of
# each and drives them in parallel through the same VPU.
C /dev/video-enc-h264 0660 root kvmd - /usr/lib/pikvm/rkmpp-h264-encoder
