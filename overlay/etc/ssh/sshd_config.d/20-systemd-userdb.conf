# Deliberately empty; replaces the file of the same name from the systemd
# package.
#
# systemd ships an AuthorizedKeysCommand pointing at `userdbctl
# ssh-authorized-keys`, which makes sshd fork userdbctl on every single login
# to ask systemd-userdbd for SSH keys held in user records. This image has no
# user records - every account here comes from /etc/passwd - and it masks
# systemd-userdbd, systemd-homed and systemd-nsresourced for that reason, so
# the command could only ever fail.
#
# It was already failing, loudly, once per login:
#
#   sshd-session: error: Unsafe AuthorizedKeysCommand "/usr/bin/userdbctl":
#                        bad ownership or modes for directory /usr
#
# (that particular complaint was a separate bug - see the overlay copy in
# build/docker/Dockerfile.rootfs - but the command is useless here either way).
