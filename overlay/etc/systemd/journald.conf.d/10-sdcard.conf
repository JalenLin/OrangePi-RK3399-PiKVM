# The journal lives in RAM on this board.
#
# The root filesystem is an SD card, and journald is the only thing on an idle
# PiKVM that writes to it at all. The byte count is not the problem - measured
# on this board, an idle system with nobody logged in writes about 52 MiB a
# day - it is the shape of the writes. journald dribbles a few hundred bytes
# at a time into an 8 MB mmap'd file, and an SD card's FTL answers a small
# write inside a 4-8 MB erase block by rewriting the whole block. A single ssh
# login costs about 248 KiB of actual card writes, almost all of it that
# amplification.
#
# Storage=volatile puts the journal in /run (tmpfs) instead. /var/log/journal
# is left in place but ignored.
#
# The cost is real and worth knowing: nothing survives a reboot, so a crash
# leaves no evidence behind. When you are chasing something that only shows up
# across a restart, put it back for the duration:
#
#     mkdir -p /etc/systemd/journald.conf.d
#     printf '[Journal]\nStorage=persistent\n' \
#         > /etc/systemd/journald.conf.d/99-debug.conf
#     systemctl restart systemd-journald
#
# and delete that file when you are done. `journalctl -f` and the kvmd web
# terminal are unaffected either way - they read the live journal.
[Journal]
Storage=volatile
RuntimeMaxUse=32M
RuntimeMaxFileSize=8M
