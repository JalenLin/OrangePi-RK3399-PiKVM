# Point the EDID loader at the bridge subdev instead of /dev/kvmd-video.
#
# Without this the board serves the EDID built into the tc35874x driver
# (drivers/media/i2c/tc35874x.c, "T749-fHD720"), which advertises exactly two
# modes - 1920x1080p60 and 1280x720p60 - has no established-timings bits set
# at all, and claims one extension block in byte 0x7e while only 128 bytes are
# ever written to the receiver's EDID RAM, so the source's read of block 1
# fails its checksum. kvmd's own /etc/kvmd/tc358743-edid.hex is a complete
# 256-byte EDID with the usual VESA established timings and a CEA-861
# extension, and it is what kvmd-edidconf and the web UI expect to be editing.
[Unit]
Wants=
Wants=dev-kvmd\x2dvideo\x2dbridge.device
After=
After=dev-kvmd\x2dvideo\x2dbridge.device systemd-modules-load.service

[Service]
ExecStart=
ExecStart=/usr/bin/v4l2-ctl --device=/dev/kvmd-video-bridge --set-edid=pad=0,file=/etc/kvmd/tc358743-edid.hex --info-edid
ExecStop=
ExecStop=/usr/bin/v4l2-ctl --device=/dev/kvmd-video-bridge --clear-edid
