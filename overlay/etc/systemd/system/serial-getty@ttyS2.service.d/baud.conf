# Pin the login console to the one rate the whole boot uses.
#
# agetty's stock ExecStart lists "115200,57600,38400,9600" and cycles through
# them on every break, so which rate you get depends on what the port last saw
# rather than on what the rest of the boot agreed on. --keep-baud did not hold
# the inherited rate here either. The visible effect is the console appearing
# to die partway through boot, which during bring-up is indistinguishable from
# a hang and cost several debugging cycles before it was understood.
#
# 115200 is the rate everything else uses now - U-Boot included, since
# patches/uboot/0001 - so naming it once here is the whole fix. It is 115200
# and not the RK3399-conventional 1500000 because the debug header has no
# flow control and the UART overruns on bursts up there; the measurements are
# in docs/patches.md.
[Service]
ExecStart=
ExecStart=-/sbin/agetty -o '-p -- \\u' --keep-baud 115200 %I $TERM
