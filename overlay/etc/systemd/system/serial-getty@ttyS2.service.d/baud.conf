# Pin the login console to the one rate the whole boot uses.
#
# U-Boot talks at 1500000 and so does the kernel, but agetty's stock
# ExecStart lists "115200,57600,38400,9600" and --keep-baud did not hold the
# inherited rate here - the port dropped to 115200 the moment systemd reached
# this unit. The visible effect is the console appearing to die partway
# through boot, which during bring-up is indistinguishable from a hang and
# cost several debugging cycles before it was understood.
#
# One rate, end to end, so a terminal opened at 1500000 stays readable from
# the first DDR line to the login prompt.
[Service]
ExecStart=
ExecStart=-/sbin/agetty -o '-p -- \\u' --keep-baud 115200 %I $TERM
