# Same pinning as serial-getty@ttyS2, for the unit that actually answers.
#
# systemd starts console-getty.service on /dev/console, not
# serial-getty@ttyS2, so the earlier drop-in never applied and agetty kept
# dropping the line to 115200 while the kernel had been talking at 1500000.
[Service]
ExecStart=
ExecStart=-/sbin/agetty -o '-p -- \\u' --keep-baud 115200 --noclear - $TERM
